services:
  db:
    image: mariadb:11
    restart: always
    command: --default-time-zone=+03:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Istanbul
    volumes:
      - db-data:/var/lib/mysql
    networks:
      metrics:
        ipv4_address: 172.21.0.10

  app:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    restart: always
    volumes:
      - ../www:/var/www/html
      # Mağazalardan indirilen ham rapor dosyaları; rebuild/clone bunları silmez.
      - raw-reports:/var/www/html/storage/app/private/raw-reports
      - ./php-fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - ./php-fpm/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    working_dir: /var/www/html
    environment:
      TZ: Europe/Istanbul
    depends_on:
      - db
    networks:
      metrics:
        ipv4_address: 172.21.0.11

  worker:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    restart: always
    command: php artisan queue:work --sleep=3 --tries=2 --max-time=3600 --timeout=600
    volumes:
      - ../www:/var/www/html
      - raw-reports:/var/www/html/storage/app/private/raw-reports
    working_dir: /var/www/html
    environment:
      TZ: Europe/Istanbul
    depends_on:
      - app
      - db
    networks:
      metrics:
        ipv4_address: 172.21.0.12

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    restart: always
    command: php artisan schedule:work
    volumes:
      - ../www:/var/www/html
      - raw-reports:/var/www/html/storage/app/private/raw-reports
    working_dir: /var/www/html
    environment:
      TZ: Europe/Istanbul
    depends_on:
      - app
      - db
    networks:
      metrics:
        ipv4_address: 172.21.0.13

  nginx:
    image: nginx:stable
    restart: always
    ports:
      - '${NGINX_BIND:-127.0.0.1:8081}:80'
    volumes:
      - ../www:/var/www/html
      - ./nginx/metrics.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      metrics:
        ipv4_address: 172.21.0.20

# kalehost stack'i 172.19.0.0/16 kullanıyor; aynı VM'de çakışmasın diye farklı subnet.
networks:
  metrics:
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  db-data:
  raw-reports:
