# Mobile Metrics MCP: example stack built on the published image.
# See docs/installation.md. Put the settings in a .env file next to this file.
#
# The web app listens on 127.0.0.1:8080. Put a reverse proxy with HTTPS in front of it.
# The app container runs the migrations and creates the OAuth keys when it starts; the worker
# and the scheduler start after it is healthy.

x-app: &app
  image: ghcr.io/bmericc/mobile-metrics-mcp:1
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    <<: *app
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:2019/metrics > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=2 --max-time=3600 --timeout=600
    # The image's health check probes the web server, which these services do not run.
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: php artisan schedule:work
    # The image's health check probes the web server, which these services do not run.
    healthcheck:
      disable: true

volumes:
  db-data:
  storage:
